 services:

  backend:
    build: ./backend
    ports:
      - "8010:8010"

  postgres:
    image: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smart_home

  mqtt:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"

  nginx:
    image: nginx
    ports:
      - "80:80"